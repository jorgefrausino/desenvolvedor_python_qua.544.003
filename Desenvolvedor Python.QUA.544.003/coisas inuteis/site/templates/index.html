<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Site em Python</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* Área onde o objeto vai bater nas paredes */
        #arena {
            position: relative;
            width: 80%;
            height: 50vh;
            border: 2px dashed #333;
            background-color: #000;
            overflow: hidden;
        }

        /* O elemento que bate e volta (Inspirado no Pac-Man) */
        #batedor {
            position: absolute;
            width: 50px;
            height: 50px;
            background-color: yellow;
            border-radius: 50%;
            top: 50px;
            left: 50px;
        }

        /* Menu de Botões */
        .menu {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }

        .btn {
            background-color: #ffcc00;
            color: #000;
            padding: 12px 20px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.2s;
        }

        .btn:hover {
            background-color: #ffea70;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>Bem-vindo e vamo ae</h1>
    
    <!-- Caixa/Área da Animação -->
    <div id="arena">
        <div id="batedor"></div>
    </div>

    <!-- Botões para as 4 páginas -->
    <div class="menu">
        <a href="/pagina1" class="btn">Jogo 1</a>
        <a href="/pagina2" class="btn">Jogo 2</a>
        <a href="/pagina3" class="btn">Jogo 3</a>
        <a href="/pacman" class="btn" style="background-color: #ff4444; color: white;">Jogar Pac-Man</a>
    </div>

    <script>
        // Código JavaScript para fazer o elemento bater nas laterais e voltar
        const batedor = document.getElementById('batedor');
        const arena = document.getElementById('arena');

        let posX = 50;
        let posY = 50;
        let velX = 3; // Velocidade horizontal
        let velY = 2; // Velocidade vertical

        function animar() {
            const arenaWidth = arena.clientWidth;
            const arenaHeight = arena.clientHeight;
            const batedorSize = 50; // largura/altura do batedor

            posX += velX;
            posY += velY;

            // Bater nas paredes direita ou esquerda
            if (posX + batedorSize >= arenaWidth || posX <= 0) {
                velX *= -1; // Inverte a direção
            }

            // Bater nas paredes cima ou baixo
            if (posY + batedorSize >= arenaHeight || posY <= 0) {
                velY *= -1; // Inverte a direção
            }

            batedor.style.left = posX + 'px';
            batedor.style.top = posY + 'px';

            requestAnimationFrame(animar);
        }

        animar();
    </script>
</body>
</html>
